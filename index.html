<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>50 US States Geography Practice Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { background-color: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.5rem; color: #38bdf8; font-weight: 700; }
    
    .search-bar { width: 100%; max-width: 400px; padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; outline: none; }
    .search-bar:focus { border-color: #38bdf8; }

    main { padding: 2rem; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
    
    .categories { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .cat-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
    .cat-btn:hover, .cat-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 600; }

    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    
    .game-card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: #38bdf8; }
    .game-card img { width: 100%; height: 140px; object-fit: cover; background-color: #000; }
    .game-card .info { padding: 0.8rem; }
    .game-card h3 { font-size: 1rem; color: #f8fafc; margin-bottom: 0.2rem; }
    .game-card p { font-size: 0.8rem; color: #94a3b8; }

    .game-view { display: none; flex-direction: column; align-items: center; gap: 1rem; }
    .game-view.active { display: flex; }
    .back-btn { align-self: flex-start; background: #334155; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    iframe { width: 100%; max-width: 960px; height: 650px; border: none; border-radius: 12px; background: #000; }
  </style>
</head>
<body>

  <header>
    <h1>US Practice Hub</h1>
    <input type="text" id="searchInput" class="search-bar" placeholder="Search activities..." onkeyup="filterGames()" />
  </header>

  <main>
    <div id="hubView">
      <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="cat-btn" onclick="filterCategory('strategy', this)">Strategy</button>
        <button class="cat-btn" onclick="filterCategory('arcade', this)">Arcade</button>
        <button class="cat-btn" onclick="filterCategory('puzzle', this)">Puzzle</button>
      </div>

      <div class="game-grid" id="gameGrid"></div>
    </div>

    <div id="gameView" class="game-view">
      <button class="back-btn" onclick="closeGame()">← Back to Hub</button>
      <h2 id="currentGameTitle"></h2>
      <iframe id="gameFrame" src="" allowfullscreen></iframe>
    </div>
  </main>

  <script>
    // Updated game list with working iframe embed URLs
    const games = [
      { 
        id: 1, 
        name: "3D Chess Set", 
        category: "strategy", 
        thumb: "https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=400&auto=format&fit=crop&q=60", 
        url: "https://lichess.org/tv/frame?theme=brown&bg=dark" 
      },
      { 
        id: 2, 
        name: "Dino Runner", 
        category: "arcade", 
        thumb: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400&auto=format&fit=crop&q=60", 
        url: "https://chromedino.com/" 
      },
      { 
        id: 3, 
        name: "Hextris", 
        category: "puzzle", 
        thumb: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=60", 
        url: "https://hextris.github.io/hextris/" 
      },
      { 
        id: 4, 
        name: "Clumsy Bird (Flappy)", 
        category: "arcade", 
        thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&auto=format&fit=crop&q=60", 
        url: "https://ellisonleao.github.io/clumsy-bird/" 
      },
      { 
        id: 5, 
        name: "Pacman Canvas", 
        category: "arcade", 
        thumb: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400&auto=format&fit=crop&q=60", 
        url: "https://pacman-canvas.herokuapp.com/" 
      }
    ];

    let currentCategory = 'all';

    function renderGames(gameList) {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '';
      gameList.forEach(game => {
        grid.innerHTML += `
          <div class="game-card" onclick="playGame('${game.name}', '${game.url}')">
            <img src="${game.thumb}" alt="${game.name}">
            <div class="info">
              <h3>${game.name}</h3>
              <p>${game.category.toUpperCase()}</p>
            </div>
          </div>
        `;
      });
    }

    function playGame(name, url) {
      document.getElementById('hubView').style.display = 'none';
      document.getElementById('gameView').classList.add('active');
      document.getElementById('currentGameTitle').innerText = name;
      document.getElementById('gameFrame').src = url;
    }

    function closeGame() {
      document.getElementById('gameFrame').src = '';
      document.getElementById('gameView').classList.remove('active');
      document.getElementById('hubView').style.display = 'block';
    }

    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = games.filter(g => 
        g.name.toLowerCase().includes(query) && 
        (currentCategory === 'all' || g.category === currentCategory)
      );
      renderGames(filtered);
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      filterGames();
    }

    renderGames(games);
  </script>
</body>
</html>
